name: Tests

# Runs the plugin hook's test suite. The suite is registered here by name: an
# unregistered suite never runs, which looks the same as one that passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load-rules hook
        run: bash hooks/load-rules.test.sh
